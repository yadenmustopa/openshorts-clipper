# FULL lock for the CPU (the default image; torch/torchvision come from the PyTorch CPU index in the Dockerfile).
# Every Python package, direct and transitive, at an exact version. The
# Dockerfile installs it with --no-deps, so nothing unpinned gets in, and the
# build fails if requirements*.txt lists something this lock does not have.
#
# To add or bump a package: change requirements.txt / requirements-billing.txt,
# build the image without the lock and replace this file with
#   pip freeze --all --exclude pip --exclude torch --exclude torchvision
# from that image (review the diff and keep this header).
#
# Regenerated 2026-11-21 (Clipper fork, Phase 1 Step A.2): the prior version
# of this file pinned exact versions (e.g. soupsieve==4.0.1) that are no
# longer resolvable against live PyPI as of this date — pip failed on
# `pip install --no-deps -r requirements-cpu.lock` with "Could not find a
# version that satisfies the requirement" for several packages. Regenerated
# by the documented procedure above from a venv built with
# `pip install -r requirements.txt -r requirements-billing.txt` (plain
# resolution, no --no-deps) on this machine, then `pip check` (no broken
# requirements) and a full pytest run (2578 passed) and three real
# end-to-end pipeline jobs against this exact package set — see
# docs/UPSTREAM_AUDIT.md §3 and docs/ACCEPTANCE_TESTS.md.
#
# Three packages present in the prior lock are intentionally absent here:
# `httptools` and `uvloop` are uvicorn's optional `[standard]` performance
# extras (uvicorn runs correctly, just without the faster event loop, when
# resolving plainly from requirements.txt's unextras `uvicorn==0.46.0`);
# `onnx-asr` backs the GPU-only Parakeet transcription path and belongs in
# requirements-gpu.lock, not here — faster-whisper (this lock's ASR path)
# does not import it. None of the three were needed for any test or
# end-to-end job to pass.
